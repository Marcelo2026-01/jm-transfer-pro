<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- CORREÇÃO 1: A BARRA ESCURA PREMIUM -->
    <meta name="theme-color" content="#111827">
    
    <title>JM Connect - Balcão Digital</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #030712; /* Fundo super escuro */
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 antialiased">

    <main class="w-full max-w-sm flex flex-col items-center">
        
        <!-- CORREÇÃO 2: ESPAÇAMENTO DO LOGO -->
        <!-- O flex-col com gap-2 garante que um texto nunca suba em cima do outro -->
        <div class="flex flex-col items-center gap-1 mb-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight">
                JM <span class="font-light text-gray-400">CONNECT</span>
            </h1>
            <h2 class="text-sm font-medium tracking-[0.2em] text-gray-500 uppercase mt-1">
                Balcão Digital
            </h2>
        </div>

        <!-- Tag do Cliente -->
        <div class="bg-[#1e293b]/50 border border-[#334155]/50 text-blue-400 rounded-full px-5 py-2.5 flex items-center gap-2 mb-10 shadow-lg">
            <!-- Ícone de Usuário -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
            <span class="text-sm font-semibold tracking-wide">VOCÊ É O CLIENTE #1</span>
        </div>

        <!-- Botão Enviar Arquivos -->
        <button class="w-full bg-[#111827] hover:bg-[#1f2937] active:scale-95 transition-all duration-200 border border-gray-800 rounded-2xl p-8 flex flex-col items-center justify-center gap-4 shadow-xl">
            <!-- Ícone de Upload (Âmbar) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span class="text-base font-medium text-gray-200 tracking-wide uppercase">Enviar Arquivos</span>
        </button>

    </main>

</body>
</html>
